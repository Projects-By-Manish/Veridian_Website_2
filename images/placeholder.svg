<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#0e1412"/>

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#344640" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.5"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="40%">
    <stop offset="0%"   stop-color="#25aa6c" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0e1412" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- Image icon -->
  <g transform="translate(600,337)" opacity="0.25">
    <rect x="-28" y="-22" width="56" height="44" rx="5" fill="none" stroke="#25aa6c" stroke-width="1.5"/>
    <circle cx="-10" cy="-6" r="5" fill="none" stroke="#25aa6c" stroke-width="1.5"/>
    <polyline points="-28,14 -10,-2 6,10 18,-4 28,14" fill="none" stroke="#25aa6c" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
